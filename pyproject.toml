[project]
name = "ampav-keybertopic"
dynamic = ["version"]
description = "KeyBERT and BERTopic tooling for the AMPAV environment"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
authors = [
    {name = "Ying Feng", email = "yingfeng@iu.edu"},
]

requires-python = ">=3.12"
dependencies = [
    "ampav-core>=0.0.20",
    "bertopic==0.17.4",
    "keybert==0.9.0",
    "sentence-transformers==5.6.0",
]

[project.urls]
Homepage = "https://github.com/AMPAV/ampav-keybertopic"
Repository = "https://github.com/AMPAV/ampav-keybertopic.git"
Issues = "https://github.com/AMPAV/ampav-keybertopic/issues"

[tool.setuptools.dynamic]
version = {attr = "ampav.keybert.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ampav*"]
namespaces = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
